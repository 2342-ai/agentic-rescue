# Agentic Rescue tmux configuration (sourced by the system tmux.conf).

set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g mouse on
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "Agentic Rescue"
# Windows are named after what runs in them; the plain shell is "rescue".
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{m:*sh,#{pane_current_command}},rescue,#{pane_current_command}}"
set -ga terminal-overrides ",xterm-256color:RGB,tmux-256color:RGB"

# Tokyo Night status line, refreshed by rescue-status.
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 30
set -g status-right-length 120
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold]  RESCUE #[bg=#1a1b26,fg=#7aa2f7]#[default] "
set -g status-right "#(rescue-status --tmux) #[fg=#565f89]C-Space ? #[default]"
setw -g window-status-format "#[fg=#565f89] #I #W "
setw -g window-status-current-format "#[fg=#c0caf5,bold] #I #W "
set -g message-style "bg=#414868,fg=#c0caf5"
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"

# Keys. All behind the prefix.
bind m display-popup -E -e RESCUE_POPUP=1 -w 90% -h 90% "rescue"
bind u display-popup -E -w 70% -h 90% "rescue-handoff link --pane '#{pane_id}'"
bind k display-popup -E -w 70% -h 90% "rescue-connect"
bind s display-popup -E -w 70% -h 50% "rescue-share; read -r -p 'Enter to close'"
bind w new-window -n wifi "impala"
bind a new-window -n agent "rescue agent"
bind ? display-popup -E -w 70% -h 70% "rescue keys; rescue help; read -r -p '  Enter to close '"
bind | split-window -h
bind - split-window -v
bind r source-file /etc/tmux.conf \; display-message "tmux.conf reloaded"
