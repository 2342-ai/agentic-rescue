name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Format
        run: nix fmt -- --check .
      - name: Evaluate the ISO configurations
        run: |
          nix eval --raw .#packages.x86_64-linux.iso.drvPath
          nix eval --raw .#packages.x86_64-linux.iso-offline.drvPath
          nix eval --raw .#packages.aarch64-linux.iso.drvPath
      - name: Fast checks
        run: |
          nix build -L .#checks.x86_64-linux.shellcheck .#checks.x86_64-linux.rescue-config .#checks.x86_64-linux.patch-tool
      - name: Web syntax and SEO checks
        run: |
          for f in web/*.js; do node --check "$f"; done
          node tests/web-seo.mjs
